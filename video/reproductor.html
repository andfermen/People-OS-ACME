<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People OS · Demo</title>
<!-- Reproductor del vídeo (D-20). Los datos salen de video/datos.js, que genera `npm run video` con el motor real. -->
<script src="datos.js"></script>
<style>
:root {
  --fondo: #eef1f5; --superficie: #ffffff; --superficie-2: #f6f8fa; --borde: #dde3ea; --texto: #18212b; --texto-2: #5b6876; --texto-3: #8a96a3;
  --acento: #3b5bdb; --acento-suave: #e8edff;
  --verde: #2f9e6a; --verde-suave: #e3f5ec; --ambar: #d69520; --ambar-suave: #fdf3dc; --rojo: #d6453d; --rojo-suave: #fde7e5;
  --real: #2f9e6a; --visual: #7b61d1; --diseno: #8a96a3;
  --radio: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #1b2129; overflow: hidden; }
body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--texto); }

/* Escenario 16:9 fijo, escalado a la ventana */
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; background: var(--fondo); display: grid; grid-template-rows: 56px 1fr 60px; grid-template-columns: 236px 1fr; transform-origin: center; overflow: hidden; }

header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: var(--superficie); border-bottom: 1px solid var(--borde); }
.logo { font-weight: 800; font-size: 19px; letter-spacing: -.3px; }
.logo span { color: var(--acento); }
.migas { color: var(--texto-2); font-size: 14px; }
.migas b { color: var(--texto); font-weight: 600; }
.demo-badge { margin-left: auto; font-size: 12px; color: #8a5a00; background: var(--ambar-suave); border: 1px solid #f1d9a6; padding: 5px 10px; border-radius: 99px; }

nav { background: var(--superficie); border-right: 1px solid var(--borde); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
nav h6 { font-size: 11px; letter-spacing: .08em; color: var(--texto-3); text-transform: uppercase; margin: 4px 10px 8px; }
.esc { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: var(--texto-2); cursor: pointer; }
.esc .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--superficie-2); border: 1px solid var(--borde); flex: none; }
.esc.hecha .n { background: var(--verde-suave); border-color: #bfe5d1; color: var(--verde); }
.esc.activa { background: var(--acento-suave); color: var(--texto); font-weight: 600; }
.esc.activa .n { background: var(--acento); border-color: var(--acento); color: #fff; }
.nav-pie { margin-top: auto; font-size: 11.5px; color: var(--texto-3); padding: 10px; line-height: 1.5; border-top: 1px solid var(--borde); }

main { padding: 26px 32px 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow: hidden; }
.cab { display: flex; align-items: flex-start; gap: 16px; }
.cab h1 { font-size: 28px; letter-spacing: -.5px; line-height: 1.2; }
.cab p { color: var(--texto-2); font-size: 16px; margin-top: 6px; max-width: 860px; }
.chip { margin-left: auto; flex: none; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.real { color: var(--real); background: var(--verde-suave); }
.chip.visual { color: var(--visual); background: #efeafd; }
.chip.diseno { color: var(--texto-2); background: var(--superficie-2); border: 1px dashed var(--texto-3); }
.lienzo { flex: 1; min-height: 0; position: relative; }

aside { position: absolute; right: 0; top: 56px; bottom: 60px; width: 410px; background: var(--superficie); border-left: 1px solid var(--borde); box-shadow: -12px 0 30px rgba(24,33,43,.10); transform: translateX(105%); transition: transform .35s ease; z-index: 5; }
aside.abierto { transform: none; }
.panel { width: 410px; padding: 22px 22px; height: 100%; overflow: auto; }
.panel h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.panel h3::before { content: "⚙"; color: var(--acento); }
.panel h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-3); margin: 14px 0 6px; }
.panel ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
.panel li { font-size: 13.5px; line-height: 1.45; color: var(--texto); padding-left: 14px; position: relative; }
.panel li::before { content: "·"; position: absolute; left: 3px; color: var(--texto-3); font-weight: 700; }
.panel code, .mono { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 4px; padding: 0 4px; }
.panel .res { background: var(--acento-suave); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }

footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 22px; background: var(--superficie); border-top: 1px solid var(--borde); }
button { font: inherit; font-size: 14px; border: 1px solid var(--borde); background: var(--superficie); padding: 8px 16px; border-radius: 8px; cursor: pointer; color: var(--texto); }
button.prim { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 600; }
button:disabled { opacity: .4; cursor: default; }
.puntos { display: flex; gap: 5px; margin: 0 auto; }
.puntos i { width: 7px; height: 7px; border-radius: 50%; background: var(--borde); }
.puntos i.on { background: var(--acento); width: 20px; border-radius: 4px; }
.atajos { font-size: 12px; color: var(--texto-3); }
.btn-panel.on { background: var(--acento-suave); border-color: #c6d2ff; }

/* Tarjetas genéricas */
.card { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px 18px; }
.fila { display: flex; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.kpi { display: flex; gap: 10px; }
.kpi div { background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 14px; min-width: 92px; }
.kpi b { font-size: 24px; display: block; transition: color .3s; }
.kpi small { font-size: 12px; color: var(--texto-2); }
.kpi .r b { color: var(--rojo); } .kpi .a b { color: var(--ambar); } .kpi .v b { color: var(--verde); }
.etq { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--texto-3); font-weight: 600; }
.sem { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
.sem.verde { background: var(--verde); } .sem.ambar { background: var(--ambar); } .sem.rojo { background: var(--rojo); }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--superficie-2); border: 1px solid var(--borde); color: var(--texto-2); white-space: nowrap; }
.tag.oculta { background: #efeafd; border-color: #d8cdf7; color: var(--visual); }
.tag.p1 { background: var(--rojo-suave); border-color: #f5c4bf; color: var(--rojo); font-weight: 700; }

/* Mapa de calor */
.mapa { display: flex; flex-direction: column; gap: 6px; }
.area { display: grid; grid-template-columns: 170px 1fr; align-items: stretch; gap: 8px; transition: opacity .4s; }
.area .nom { font-size: 13px; font-weight: 600; color: var(--texto-2); display: flex; align-items: center; }
.area .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mapa.foco .area:not(.foco) { opacity: .22; }
.tile { min-width: 0; border-radius: 8px; padding: 6px 10px; display: grid; grid-template-columns: 1fr auto; column-gap: 6px; align-items: center; border: 1px solid transparent; transition: background-color .8s, border-color .8s, transform .3s; position: relative; }
.tile .id { font-size: 11px; font-weight: 700; opacity: .8; }
.tile .nm { grid-column: 1 / -1; font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .cob { font-size: 11.5px; font-weight: 600; justify-self: end; }
.tile.verde { background: var(--verde-suave); border-color: #c4e8d4; color: #1d6b47; }
.tile.ambar { background: var(--ambar-suave); border-color: #f1d9a6; color: #8a5a00; }
.tile.rojo { background: var(--rojo-suave); border-color: #f5c4bf; color: #a12d26; }
.tile.pulso { animation: pulso 1.4s ease 2; z-index: 1; }
.tile.marca { outline: 2px solid var(--acento); outline-offset: 2px; }
@keyframes pulso { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59,91,219,0); } 40% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(59,91,219,.25); } }

/* Arquitectura */
.arq { display: grid; grid-template-columns: 1fr 44px 1.5fr 44px 1fr; gap: 18px 0; align-content: start; }
.capa { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; }
.capa h4 { font-size: 16px; }
.capa p, .capa li { font-size: 13.5px; color: var(--texto-2); line-height: 1.45; }
.capa ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.capa .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--acento); }
.capa.orq { border: 2px solid var(--acento); background: linear-gradient(180deg, #f5f7ff, #fff); }
.agentes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.agente { border: 1px solid #c6d2ff; background: #fff; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.agente b { display: block; font-size: 13.5px; }
.agente small { color: var(--texto-2); }
.capa.humano { border: 2px solid var(--verde); background: linear-gradient(180deg, #f1fbf6, #fff); }
.capa.ia { border-style: dashed; }
.flecha { align-self: center; justify-self: center; color: var(--texto-3); font-size: 22px; }
.lema { grid-column: 1 / -1; text-align: center; font-size: 17px; color: var(--texto-2); margin-top: 10px; }

/* Flujo n8n */
.flujo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: stretch; }
.bloque { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; opacity: .35; transition: opacity .5s, border-color .5s, box-shadow .5s; }
.bloque.on { opacity: 1; border-color: var(--acento); box-shadow: 0 6px 18px rgba(59,91,219,.12); }
.bloque h4 { font-size: 14px; margin-bottom: 8px; }
.nodo { font-size: 12.5px; padding: 5px 8px; border-radius: 6px; background: var(--superficie-2); border: 1px solid var(--borde); margin-bottom: 5px; display: flex; justify-content: space-between; gap: 6px; }
.nodo small { color: var(--texto-3); }
.nodo.sheets { border-left: 3px solid #1e8e3e; } .nodo.code { border-left: 3px solid #e8710a; } .nodo.http { border-left: 3px solid var(--acento); } .nodo.gmail { border-left: 3px solid #d93025; }

/* Formulario */
.form { width: 520px; margin: 10px auto 0; background: var(--superficie); border-radius: 14px; border: 1px solid var(--borde); box-shadow: 0 10px 30px rgba(24,33,43,.08); padding: 26px 30px; }
.form h2 { font-size: 20px; margin-bottom: 4px; }
.form p { color: var(--texto-2); font-size: 14px; margin-bottom: 18px; }
.campo { margin-bottom: 14px; }
.campo label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px; }
.campo .inp { border: 1px solid var(--borde); border-radius: 8px; padding: 9px 12px; font-size: 15px; background: var(--superficie-2); }
.escribe { display: inline-block; overflow: hidden; white-space: nowrap; border-right: 2px solid var(--acento); animation: escribe 1s steps(12) .4s both, cursor .8s step-end infinite; max-width: 100%; }
@keyframes escribe { from { width: 0; } }
@keyframes cursor { 50% { border-color: transparent; } }
.form .enviar { background: var(--acento); color: #fff; text-align: center; padding: 10px; border-radius: 8px; font-weight: 600; margin-top: 6px; }

/* Email */
.mail { background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 100%; }
.mail .hd { padding: 14px 20px; border-bottom: 1px solid var(--borde); }
.mail .hd b { font-size: 16px; }
.mail .hd small { display: block; color: var(--texto-2); font-size: 12.5px; margin-top: 3px; }
.mail .bd { padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; font-size: 13.5px; line-height: 1.45; overflow: hidden; }
.opcion { border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.opcion .coste { color: #a12d26; }
.aprobar { align-self: flex-start; background: #1a73e8; color: #fff; border-radius: 4px; padding: 3px 10px; font-size: 12px; margin-top: 4px; }
.confid { background: #fff4e5; border-radius: 8px; padding: 10px 12px; }

/* Tablas */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--texto-3); padding: 6px 8px; border-bottom: 1px solid var(--borde); }
td { padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
td:first-child, td .dec { white-space: nowrap; }
.ley { display: flex; gap: 22px; margin-top: 16px; font-size: 13.5px; color: var(--texto-2); }
.ley i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.captura *, .captura *::before { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
.dec { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.dec.aprobada { background: var(--verde-suave); color: var(--verde); } .dec.descartada { background: var(--superficie-2); color: var(--texto-3); text-decoration: line-through; } .dec.pendiente { background: var(--ambar-suave); color: #8a5a00; }

/* Línea de tiempo */
.tl { display: flex; align-items: flex-start; }
.hito { flex: 1; text-align: center; position: relative; font-size: 12.5px; color: var(--texto-2); padding: 0 6px; }
.hito::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--borde); z-index: 0; }
.hito:first-child::before { display: none; }
.hito .pt { width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 8px; position: relative; z-index: 1; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; }
.pt.verde { background: var(--verde); } .pt.ambar { background: var(--ambar); } .pt.rojo { background: var(--rojo); }

/* Escalado */
.procs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.proc { background: var(--superficie); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.proc b { font-size: 14px; }
.est { font-size: 11px; font-weight: 700; align-self: flex-start; padding: 2px 8px; border-radius: 99px; }
.est.c { background: var(--verde-suave); color: var(--verde); } .est.d { background: var(--superficie-2); color: var(--texto-2); border: 1px dashed var(--texto-3); } .est.f { background: #f3f3f3; color: var(--texto-3); }
.receta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.receta span { background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 12px; }
.receta span.h { border-color: var(--verde); background: var(--verde-suave); }
.receta i { color: var(--texto-3); font-style: normal; }
pre.yaml { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 14px; line-height: 1.6; background: #18212b; color: #dfe6ee; border-radius: 10px; padding: 16px 18px; white-space: pre; }
pre.yaml .k { color: #8fb4ff; } pre.yaml .v { color: #ffd38a; }

.cierre { height: 100%; display: grid; place-items: center; text-align: center; }
.cierre blockquote { font-size: 38px; line-height: 1.3; letter-spacing: -.6px; max-width: 1000px; font-weight: 700; }
.cierre blockquote span { color: var(--acento); }
.cierre p { margin-top: 26px; color: var(--texto-2); font-size: 17px; }

.aparece { animation: aparece .5s ease both; }
@keyframes aparece { from { opacity: 0; transform: translateY(8px); } }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; }
.nota { font-size: 12.5px; color: var(--texto-3); }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="logo">acme<span>.</span> People OS</div>
    <div class="migas">Acme / People OS / <b id="miga"></b></div>
    <div class="demo-badge">Entorno de demostración · datos ficticios</div>
  </header>
  <nav id="nav"></nav>
  <main>
    <div class="cab"><div><h1 id="titulo"></h1><p id="sub"></p></div><span id="chip" class="chip"></span></div>
    <div class="lienzo" id="lienzo"></div>
  </main>
  <aside id="aside"><div class="panel" id="panel"></div></aside>
  <footer>
    <button id="ant">← Anterior</button>
    <span class="atajos">← → para navegar · D panel técnico</span>
    <div class="puntos" id="puntos"></div>
    <button id="btnPanel" class="btn-panel">¿Qué ha pasado por debajo?</button>
    <button id="sig" class="prim">Siguiente →</button>
  </footer>
</div>

<script>
const D = window.DEMO;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = s => esc(s).replace(/(\d)\.(\d)/g, '$1,$2'); // decimales con coma
const SEM = { verde: 'verde', ambar: 'ámbar', rojo: 'rojo' };
const sk = id => D.nombres.skills[id] || id;
const fn = (m, id) => D.mapas[m].funciones.find(f => f.id === id);
const skl = (m, f, s) => fn(m, f).skills.find(x => x.skill === s);
const corto = n => n.split(' ')[0];
const CAPTURA = location.search.includes('captura'); // ?captura: estado final al instante (para revisar o hacer capturas)
if (CAPTURA) document.documentElement.classList.add('captura');
const despues = (f, ms) => (CAPTURA ? (f(), 0) : setTimeout(f, ms));

// ---------- Componentes ----------
function kpi(m) {
  const c = D.mapas[m].cuenta;
  return `<div class="kpi" id="kpi"><div class="r"><b>${c.rojo}</b><small>en rojo</small></div><div class="a"><b>${c.ambar}</b><small>en ámbar</small></div><div class="v"><b>${c.verde}</b><small>en verde</small></div></div>`;
}
function mapa(m, { foco = null, marcar = [] } = {}) {
  const areas = [];
  for (const f of D.mapas[m].funciones) { let a = areas.find(x => x.nombre === f.area); if (!a) areas.push(a = { nombre: f.area, fs: [] }); a.fs.push(f); }
  return `<div class="mapa${foco ? ' foco' : ''}" id="mapa">${areas.map(a => `<div class="area${a.nombre === foco ? ' foco' : ''}"><div class="nom">${esc(a.nombre)}</div><div class="tiles">${a.fs.map(f => `
    <div class="tile ${f.semaforo}${marcar.includes(f.id) ? ' marca' : ''}" data-f="${f.id}"><span class="id">${f.id}${f.prioridad !== '-' ? ' · ' + f.prioridad : ''}</span><span class="cob">${f.cobertura}/${f.objetivo}</span><span class="nm">${esc(f.nombre)}</span></div>`).join('')}</div></div>`).join('')}</div>`;
}
// Pasa el mapa del estado a al b: cambia colores y cifras, y hace latir lo que cambia
function transicion(a, b, retraso = 900) {
  return despues(() => {
    for (const f of D.mapas[b].funciones) {
      const el = document.querySelector(`[data-f="${f.id}"]`); if (!el) continue;
      const antes = D.mapas[a].funciones.find(x => x.id === f.id);
      el.classList.remove('verde', 'ambar', 'rojo'); el.classList.add(f.semaforo);
      el.querySelector('.cob').textContent = `${f.cobertura}/${f.objetivo}`;
      el.querySelector('.id').textContent = f.id + (f.prioridad !== '-' ? ' · ' + f.prioridad : '');
      if (antes.semaforo !== f.semaforo || antes.cobertura !== f.cobertura) { el.classList.remove('pulso'); void el.offsetWidth; el.classList.add('pulso'); }
    }
    const c = D.mapas[b].cuenta, k = document.querySelectorAll('#kpi b');
    if (k.length) [c.rojo, c.ambar, c.verde].forEach((v, i) => (k[i].textContent = v));
  }, retraso);
}
// Formulario de n8n con título, descripción y campos del JSON real; los valores son los del ensayo
function formulario(fm, nodo, valores, notas = {}) {
  return `<div class="form aparece"><h2>${esc(fm.titulo)}</h2><p>${esc(fm.descripcion)}</p>

const PASOS = TODOS.filter(p => COMPLETO || !p.largo);

// ---------- Navegación ----------
let i = 0, temporizadores = [], panelAbierto = /panel/.test(location.search);
const nav = $('#nav');
nav.innerHTML = `<h6>Demostración</h6>${ESCENAS.map((n, k) => `<div class="esc" data-e="${k}"><span class="n">${k + 1}</span>${n}</div>`).join('')}<div class="nav-pie">Datos: <span class="mono">npm run video</span> (${esc(D.generado)})<br>Motor real del repo · propuesta por reglas</div>`;
nav.querySelectorAll('.esc').forEach(el => el.onclick = () => ir(PASOS.findIndex(p => p.e === +el.dataset.e)));
$('#puntos').innerHTML = PASOS.map(() => '<i></i>').join('');

function ir(n) {
  i = Math.max(0, Math.min(PASOS.length - 1, n));
  temporizadores.forEach(clearTimeout); temporizadores = [];
  const p = PASOS[i];
  $('#miga').textContent = ESCENAS[p.e];
  $('#titulo').textContent = p.t; $('#sub').textContent = p.s;
  $('#chip').className = 'chip ' + p.chip[0]; $('#chip').textContent = p.chip[1];
  $('#lienzo').innerHTML = p.html();
  $('#panel').innerHTML = p.panel ? p.panel() : '';
  $('#aside').classList.toggle('abierto', !!p.panel && panelAbierto);
  $('#btnPanel').classList.toggle('on', panelAbierto); $('#btnPanel').disabled = !p.panel;
  if (p.luego) { const t = p.luego(); if (t) temporizadores.push(t); }
  nav.querySelectorAll('.esc').forEach(el => { const e = +el.dataset.e; el.classList.toggle('activa', e === p.e); el.classList.toggle('hecha', e < p.e); });
  document.querySelectorAll('#puntos i').forEach((el, k) => el.classList.toggle('on', k === i));
  $('#ant').disabled = i === 0; $('#sig').disabled = i === PASOS.length - 1;
  history.replaceState(null, '', '#' + (i + 1));
}
function alternarPanel() {
  if (!PASOS[i].panel) return;
  panelAbierto = !panelAbierto; // sin volver a pintar el paso: la animación no se repite
  $('#aside').classList.toggle('abierto', panelAbierto); $('#btnPanel').classList.toggle('on', panelAbierto);
}
$('#ant').onclick = () => ir(i - 1); $('#sig').onclick = () => ir(i + 1); $('#btnPanel').onclick = alternarPanel;
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); ir(i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') ir(i - 1);
  else if (e.key.toLowerCase() === 'd') alternarPanel();
  else if (e.key.toLowerCase() === 'r') ir(i); // repite la animación del paso
});
function escalar() { const s = Math.min(innerWidth / 1600, innerHeight / 900); $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener('resize', escalar); escalar();
ir((+location.hash.slice(1) || 1) - 1);
</script>
</body>
</html>
